# One-click knowledge-base indexing: Actions → "Index textbook" → Run workflow.
# Needs repository secrets GOOGLE_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
name: Index textbook

on:
  workflow_dispatch:
    inputs:
      pdf:
        description: PDF path in the repo
        default: "Sources/Tidy's Physiotherapy.pdf"
      source:
        description: Name shown in citations
        default: "Tidy's Physiotherapy"
      replace:
        description: Delete this source's old chunks first
        type: boolean
        default: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Index
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PDF: ${{ inputs.pdf }}
          SOURCE: ${{ inputs.source }}
          REPLACE: ${{ inputs.replace }}
        run: |
          args=("$PDF" --source "$SOURCE")
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          python -m physiobot.ingest "${args[@]}"
