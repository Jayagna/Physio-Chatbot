# Knowledge-base indexing: Actions → "Index textbook" → Run workflow.
# Needs repository secrets GOOGLE_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
#
# The Gemini free tier allows about 1,000 embeddings a day, shared with the
# chatbot's questions. Runs embed at most `limit` new chunks per quota day (even
# if GitHub delays a scheduled run onto the same day as a manual one) and resume
# where the last one stopped; the daily schedule finishes a large book over a
# few days and does nothing once everything is stored.
name: Index textbook

on:
  schedule:
    - cron: "30 8 * * *" # 14:00 IST, after the free quota resets
  workflow_dispatch:
    inputs:
      pdf:
        description: PDF path in the repo
        default: "Sources/Tidy's Physiotherapy.pdf"
      source:
        description: Name shown in citations
        default: "Tidy's Physiotherapy"
      limit:
        description: Most chunks to embed per Gemini quota day (leave room for the chatbot's questions)
        default: "800"
      replace:
        description: Delete this source's chunks and start over
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Index
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Scheduled runs have no inputs, so fall back to the defaults.
          PDF: ${{ inputs.pdf || 'Sources/Tidy''s Physiotherapy.pdf' }}
          SOURCE: ${{ inputs.source || 'Tidy''s Physiotherapy' }}
          LIMIT: ${{ inputs.limit || '800' }}
          REPLACE: ${{ inputs.replace || false }}
        run: |
          args=("$PDF" --source "$SOURCE" --limit "$LIMIT")
          if [ "$REPLACE" = "true" ]; then args+=(--replace); else args+=(--resume); fi
          python -m physiobot.ingest "${args[@]}"
